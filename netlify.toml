# Snapvere by Brendigo
# Netlify konfiguracija za Snapvere landing.
# Sajt je čisti statički HTML/CSS/JS — nema build koraka.
# Objavljuje se sadržaj foldera `site/`.

[build]
  publish = "site"
  command = ""

# Sigurnosni + cache headeri
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'none'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self'; script-src 'self' 'sha256-uajlxsPQ4Jo6W4fgW5sv+cwmjnHVwP64qHKITPLq/eU=' 'sha256-Vk4233Z0N+ELdeJN4GntaNsyZp9y2LREQRuaQx0J7W4=' 'sha256-ZnYJX5ypMaaAhxxWhSEjbMkhO2A9yPmbzEQH3LFaITA='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; worker-src 'none'; upgrade-insecure-requests"

# Fiksna imena fajlova → uvijek revalidiraj (immutable bi zaključao stari cache).
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Verified release packages are served directly from site/files on snapvere.com.
