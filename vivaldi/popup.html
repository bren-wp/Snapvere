<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>SNAPVERE — Browser capture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header class="header">
      <div class="mark" aria-hidden="true">S</div>
      <div class="identity">
        <strong>SNAPVERE</strong>
        <span>Browser capture</span>
      </div>
      <span class="label">LOCAL</span>
    </header>
    <section class="panel" aria-label="Screenshot actions">
      <h1>Capture your tab</h1>
      <p>Keep screenshots on your device. Choose what to capture or open the editor.</p>
      <div class="action-stack" role="group" aria-label="Capture options">
        <button class="capture" type="button" data-action="visible">
          <span class="action-icon" aria-hidden="true">▣</span><span class="action-label">Save visible tab PNG</span>
        </button>
        <button class="secondary" type="button" data-action="area">
          <span class="action-icon" aria-hidden="true">⊞</span><span class="action-label">Select area &amp; crop</span>
        </button>
        <button class="secondary" type="button" data-action="full">
          <span class="action-icon" aria-hidden="true">↧</span><span class="action-label">Full webpage</span>
        </button>
        <button class="secondary" type="button" data-action="edit">
          <span class="action-icon" aria-hidden="true">✎</span><span class="action-label">Edit visible tab</span>
        </button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite">Ready to capture.</p>
      <p id="note" class="note">Select area opens a private crop tool. Full webpage scrolls the active tab, then restores its previous position.</p>
    </section>
    <footer>
      <span>No account · No uploads</span>
      <a href="https://snapvere.com/" target="_blank" rel="noopener noreferrer"
         aria-label="Official Snapvere website">snapvere.com</a>
    </footer>
  </main>
  <script src="capture.js"></script>
  <script src="workspace.js"></script>
  <script src="popup.js"></script>
</body>
</html>
