# Snapvere by Brendigo
[package]
name = "snapvere-native-updater"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
snapvere-native-update-auth = { path = "../native-update-auth" }
flate2 = "=1.1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tempfile = "=3.27.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
