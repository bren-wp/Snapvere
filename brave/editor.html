<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>SNAPVERE — Screenshot editor</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">S</span><div><strong>SNAPVERE</strong><small>Private browser editor</small></div></div>
    <div class="controls" role="toolbar" aria-label="Annotation tools">
      <button type="button" data-tool="pen" aria-pressed="false">Pen</button>
      <button type="button" data-tool="rectangle" aria-pressed="false">Rectangle</button>
      <button type="button" data-tool="text" aria-pressed="false">Text</button>
      <button type="button" data-tool="crop" aria-pressed="false">Select area / Crop</button>
      <label class="color-label" for="color">Colour <input id="color" type="color" value="#a87aff"></label>
      <label for="thickness">Size <input id="thickness" type="range" min="1" max="20" value="4"></label>
      <button type="button" id="apply-crop" hidden>Apply crop</button>
      <button type="button" id="undo">Undo</button>
      <button type="button" id="reset">Reset</button>
    </div>
    <div class="actions">
      <button type="button" id="copy-desktop" title="Copy the PNG to Windows clipboard; then import it from Snapvere desktop.">Copy for Windows app</button>
      <button type="button" id="save" class="primary">Save PNG</button>
    </div>
  </header>
  <main>
    <p id="status" role="status" aria-live="polite">Preparing screenshot…</p>
    <p class="hint">Select a tool and drag on the picture. For Text, click a position. Screenshots remain on your device.</p>
    <div class="canvas-scroll" id="scroll"><canvas id="editor-canvas" aria-label="Screenshot with annotations" tabindex="0"></canvas></div>
  </main>
  <footer>
    <span>Local edits only • No uploads • Copy to clipboard is user-initiated</span>
    <a href="https://snapvere.com/" target="_blank" rel="noopener noreferrer">snapvere.com</a>
  </footer>
  <script src="workspace.js"></script>
  <script src="editor.js"></script>
</body>
</html>
