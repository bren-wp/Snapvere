# Snapvere by Brendigo
name: Native update authentication acceptance
on:
  pull_request:
    paths:
      - 'tools/native-update-auth/**'
      - 'tools/test_native_update_auth.py'
      - '.github/workflows/native-update-auth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - name: Resolve isolated verifier lock for review
        working-directory: tools/native-update-auth
        run: cargo generate-lockfile
      - name: Compile and test locked verifier
        working-directory: tools/native-update-auth
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --locked
      - name: OpenSSL signature interoperability
        if: runner.os == 'Linux'
        run: python tools/test_native_update_auth.py tools/native-update-auth/target/debug/snapvere-native-update-auth
      - name: Export dependency resolution for review, not distribution
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: native-update-auth-lock-review
          path: tools/native-update-auth/Cargo.lock
          if-no-files-found: error
          retention-days: 7
