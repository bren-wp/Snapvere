name: Audit Snapvere release channel metadata
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Snapvere Windows and Linux preview release']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: read
concurrency:
  group: snapvere-release-preview-integrity
  cancel-in-progress: false
jobs:
  audit-unsigned-preview-metadata:
    name: Verify stable-channel metadata for new releases
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Require stable metadata for verified new distributions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::Use main for release reconciliation"; exit 1; }
          # Starting with v0.2.39, stable denotes the distribution channel,
          # not publisher signing or physical-device certification.
          # Historical releases and all drafts remain untouched.
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]')"
          candidates="$(jq -rs '.[] | select(.draft == false) | select(.tag_name | test("^v[0-9]+[.][0-9]+[.][0-9]+$")) | select((.tag_name[1:] | split(".") | map(tonumber)) >= [0,2,39]) | .id' <<< "$releases")"
          while IFS= read -r id; do
            [[ -n "$id" ]] || continue
            release="$(gh api "repos/$GITHUB_REPOSITORY/releases/$id")"
            tag="$(jq -r '.tag_name' <<< "$release")"
            [[ "$(jq -r '.draft' <<< "$release")" == false ]] || continue
            jq -e --arg tag "$tag" '.tag_name == $tag and .draft == false and .prerelease == false' <<< "$release" >/dev/null
            echo "$tag: stable distribution status verified"
          done <<< "$candidates"
