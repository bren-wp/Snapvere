name: Snapvere Windows and Linux preview release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'apps/**'
      - 'tools/build_browser_extensions.py'
      - 'tools/test_browser_extension_line_endings.py'
      - '.gitattributes'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: snapvere-desktop-release-main
  cancel-in-progress: false
jobs:
  linux-build:
    name: Build Linux preview .deb and AppImage from release revision
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Tauri and xcap Linux native dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev \
            libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev \
            libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev libfuse2t64
      - name: Verify required GBM development linker library
        run: |
          pkg-config --exists gbm
          pkg-config --modversion gbm
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install locked JS dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Shared frontend and Linux native acceptance gates
        working-directory: apps/desktop
        run: |
          npm run lint
          npm run test:unit
          npm run build
      - name: Native Linux Rust checks
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --all -- --check
          cargo test --locked
          cargo clippy --all-targets --locked -- -D warnings
      - name: Build Free Linux DEB and AppImage
        working-directory: apps/desktop
        run: npm run tauri -- build --bundles deb,appimage
      - name: Stage Free Linux packages before Pro build
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          root=apps/desktop/src-tauri/target/release/bundle
          deb=("$root"/deb/*.deb)
          images=("$root"/appimage/*.AppImage)
          [[ ${#deb[@]} == 1 && ${#images[@]} == 1 ]] || { echo "::error::Free Linux packages missing"; exit 1; }
          mkdir -p dist-linux
          cp -- "${deb[0]}" dist-linux/Snapvere-Linux-amd64.deb
          cp -- "${images[0]}" dist-linux/Snapvere-Linux-x86_64.AppImage
          rm -rf -- "$root/deb" "$root/appimage"
      - name: Test native Pro Rust features and batch export
        working-directory: apps/desktop/src-tauri
        run: cargo test --features pro --locked
      - name: Build Pro Linux DEB and AppImage
        working-directory: apps/desktop
        env:
          VITE_SNAPVERE_EDITION: pro
        run: npm run tauri -- build --bundles deb,appimage --features pro --config src-tauri/tauri.pro.conf.json
      - name: Verify both Linux editions and checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          root=apps/desktop/src-tauri/target/release/bundle
          deb=("$root"/deb/*.deb)
          images=("$root"/appimage/*.AppImage)
          [[ ${#deb[@]} == 1 && ${#images[@]} == 1 ]] || { echo "::error::Pro Linux packages missing"; exit 1; }
          [[ "${deb[0],,}" == *pro* && "${images[0],,}" == *pro* ]] || { echo "::error::Pro product identity missing"; exit 1; }
          cp -- "${deb[0]}" dist-linux/Snapvere-Pro-Linux-amd64.deb
          cp -- "${images[0]}" dist-linux/Snapvere-Pro-Linux-x86_64.AppImage
          for artifact in dist-linux/*.deb dist-linux/*.AppImage; do
            test "$(stat -c%s "$artifact")" -gt 1000000 || { echo "::error::Undersized Linux artifact"; exit 1; }
          done
          if cmp -s dist-linux/Snapvere-Linux-amd64.deb dist-linux/Snapvere-Pro-Linux-amd64.deb; then
            echo "::error::Free and Pro packages are identical"
            exit 1
          fi
          chmod 755 dist-linux/*.AppImage
          (cd dist-linux && sha256sum Snapvere-Linux-amd64.deb Snapvere-Linux-x86_64.AppImage Snapvere-Pro-Linux-amd64.deb Snapvere-Pro-Linux-x86_64.AppImage > SHA256SUMS-Linux.txt)
          (cd dist-linux && sha256sum --check SHA256SUMS-Linux.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Snapvere-Linux-release-${{ github.sha }}
          path: dist-linux/*
          if-no-files-found: error
          retention-days: 90

  windows-release:
    needs: linux-build
    permissions:
      contents: write
    name: Verify Windows packages and publish Windows + Linux preview
    runs-on: windows-latest
    timeout-minutes: 160
    steps:
      - name: Checkout release revision without persisting publish credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Determine and verify Snapvere version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content 'apps/desktop/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $pkg = Get-Content 'apps/desktop/package.json' -Raw | ConvertFrom-Json
          if ($config.productName -ne 'Snapvere') { throw 'Incorrect application name' }
          if ($config.identifier -ne 'com.brendigo.snapvere') { throw 'Incorrect application identifier' }
          if ($pkg.version -ne $config.version) { throw 'Package versions are not synchronized' }
          if ([string]::IsNullOrWhiteSpace($config.version)) { throw 'Empty release version' }
          $cargo = Get-Content 'apps/desktop/src-tauri/Cargo.toml' -Raw
          $cargoLock = Get-Content 'apps/desktop/src-tauri/Cargo.lock' -Raw
          $npmLock = Get-Content 'apps/desktop/package-lock.json' -Raw | ConvertFrom-Json -AsHashtable
          # Rust files may have CRLF on Windows. Compare parsed values, not lines
          # anchored to LF-only endings.
          $cargoVersion = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $cargoLockVersion = [regex]::Match($cargoLock, '(?s)\[\[package\]\]\s+name\s*=\s*"snapvere"\s+version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($cargoVersion -ne $config.version) { throw "Rust package version mismatch: $cargoVersion" }
          if ($cargoLockVersion -ne $config.version) { throw "Cargo.lock version mismatch: $cargoLockVersion" }
          if ($npmLock['version'] -ne $config.version -or $npmLock['packages']['']['version'] -ne $config.version) { throw 'npm lockfile version differs from release version' }
          "value=$($config.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Prevent overwriting an existing release tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseTag = 'v${{ steps.version.outputs.value }}'
          $matching = git ls-remote --tags origin "refs/tags/$releaseTag"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify release tag availability' }
          if (-not [string]::IsNullOrWhiteSpace(($matching | Out-String).Trim())) {
            throw "Refusing to overwrite existing release: $releaseTag. Bump all app versions."
          }
      - name: Install dependencies using lockfile without arbitrary lifecycle scripts
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strict TypeScript static analysis
        working-directory: apps/desktop
        run: npm run lint
      - name: Verify screenshot exports and gallery pagination
        working-directory: apps/desktop
        run: npm run test:unit
      - name: Build and typecheck frontend
        working-directory: apps/desktop
        run: npm run build
      - name: Audit locked JavaScript dependencies
        working-directory: apps/desktop
        run: npm audit --audit-level=high
      - name: Install pinned RustSec advisory scanner
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Assert SQLite bundled crate contains known CVE-2026-119375 fix
        run: python tools/check_sqlite_security.py
      - name: Check Rust dependency advisories before publishing
        run: cargo audit --file apps/desktop/src-tauri/Cargo.lock
      - name: Verify Rust formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check
      - name: Enforce Rust Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test Rust core on Windows
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      - name: Verify offline app and block unreviewed backdoor/network/process patterns
        run: python tools/check_no_backdoor_patterns.py
      - name: Enforce reachable Rust modules (dead-code graph)
        run: python tools/check_rust_modules.py
      - name: Verify Tailwind 4 migration and CSS-first design tokens
        run: python tools/check_tailwind4.py
      - name: Fail on unsafe dynamic HTML/code execution in public JavaScript
        run: python tools/check_frontend_security.py
      - name: Verify installer license and public distribution
        run: python tools/check_public_distribution.py
      - name: Verify both edition release and native security contracts
        run: python tools/check_edition_distribution.py
      - name: Verify all frontend IPC commands are registered by Rust
        run: python tools/check_ipc_contract.py
      - name: Enforce per-window Tauri capability isolation
        run: python tools/check_tauri_capabilities.py
      - name: Enforce read-only dependency update policy
        run: python tools/check_dependency_policy.py
      - name: Audit all seven extensions and their static/dead-file graph
        shell: pwsh
        run: |
          # This release previously failed because Git for Windows checked out
          # JSON with CRLF while the canonical manifests were generated with LF.
          python tools/test_browser_extension_line_endings.py
          if ($LASTEXITCODE -ne 0) { throw "LF/CRLF source regression failed" }
          python tools/build_browser_extensions.py --check
          if ($LASTEXITCODE -ne 0) { throw "Browser packages differ from audited canonical source" }
          python tools/check_browser_extensions.py
          if ($LASTEXITCODE -ne 0) { throw "Extension security policy failed" }
          python tools/audit_browser_extension_graph.py
          if ($LASTEXITCODE -ne 0) { throw "Unreachable or stale browser asset found" }
          python tools/check_extension_privacy.py
          if ($LASTEXITCODE -ne 0) { throw "Extension privacy audit failed" }
          node tools/check_translation_coverage.mjs
          if ($LASTEXITCODE -ne 0) { throw "UI translation coverage audit failed" }
          python tools/check_extension_design_tokens.py
          if ($LASTEXITCODE -ne 0) { throw "Browser UI and Windows design palette diverged" }
          foreach ($browser in @('chrome','firefox','edge','brave','opera','vivaldi','safari')) {
            foreach ($asset in @('capture.js','workspace.js','background.js','popup.js','editor.js')) {
              node --check "$browser/$asset"
              if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax error: $browser/$asset" }
            }
          }
          Push-Location extensions
          try {
            # PowerShell does not perform Bash-style wildcard expansion for
            # native executables; Node's test discovery is cross-platform.
            node --test
            if ($LASTEXITCODE -ne 0) { throw "Extension behavior regression failed" }
          } finally {
            Pop-Location
          }
      - name: Build Free Windows NSIS EXE and MSI
        working-directory: apps/desktop
        run: npm run tauri -- build --bundles nsis,msi
      - name: Stage Free Windows binaries and installer packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path $PWD 'apps/desktop/src-tauri/target/release'
          $dist = Join-Path $PWD 'dist-installers'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $exe = Join-Path $base 'snapvere.exe'
          $nsis = @(Get-ChildItem (Join-Path $base 'bundle/nsis') -Filter '*.exe' -File)
          $msi = @(Get-ChildItem (Join-Path $base 'bundle/msi') -Filter '*.msi' -File)
          if (!(Test-Path $exe) -or $nsis.Count -ne 1 -or $msi.Count -ne 1) { throw 'Incomplete Free Windows edition' }
          Copy-Item $exe (Join-Path $dist 'Snapvere-Portable.exe')
          Copy-Item $nsis[0].FullName (Join-Path $dist 'Snapvere-Setup.exe')
          Copy-Item $msi[0].FullName (Join-Path $dist 'Snapvere-Setup.msi')
          Remove-Item (Join-Path $base 'bundle/nsis') -Recurse -Force
          Remove-Item (Join-Path $base 'bundle/msi') -Recurse -Force
      - name: Test native Pro Rust features and batch export
        working-directory: apps/desktop/src-tauri
        run: cargo test --features pro --locked
      - name: Build Pro Windows NSIS EXE and MSI
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $env:VITE_SNAPVERE_EDITION = 'pro'
          npm run tauri -- build --bundles nsis,msi --features pro --config src-tauri/tauri.pro.conf.json
          if ($LASTEXITCODE -ne 0) { throw 'Pro native build failed' }
      - name: Stage and verify Pro Windows edition
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path $PWD 'apps/desktop/src-tauri/target/release'
          $dist = Join-Path $PWD 'dist-installers'
          $exe = Join-Path $base 'snapvere.exe'
          $nsis = @(Get-ChildItem (Join-Path $base 'bundle/nsis') -Filter '*.exe' -File)
          $msi = @(Get-ChildItem (Join-Path $base 'bundle/msi') -Filter '*.msi' -File)
          if (!(Test-Path $exe) -or $nsis.Count -ne 1 -or $msi.Count -ne 1) { throw 'Incomplete Pro Windows edition' }
          if ($nsis[0].Name -notmatch 'Pro' -or $msi[0].Name -notmatch 'Pro') { throw 'Pro product identity missing' }
          Copy-Item $exe (Join-Path $dist 'Snapvere-Pro-Portable.exe')
          Copy-Item $nsis[0].FullName (Join-Path $dist 'Snapvere-Pro-Setup.exe')
          Copy-Item $msi[0].FullName (Join-Path $dist 'Snapvere-Pro-Setup.msi')
          if ((Get-FileHash (Join-Path $dist 'Snapvere-Portable.exe')).Hash -eq
              (Get-FileHash (Join-Path $dist 'Snapvere-Pro-Portable.exe')).Hash) { throw 'Free and Pro binaries are identical' }
      - name: Download already verified Linux preview packages from this commit
        uses: actions/download-artifact@v4
        with:
          name: Snapvere-Linux-release-${{ github.sha }}
          path: dist-linux
      - name: Collect and verify Windows and Linux release packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $PWD "dist-installers"
          $windowsNames = @('Snapvere-Portable.exe','Snapvere-Setup.exe','Snapvere-Setup.msi',
                            'Snapvere-Pro-Portable.exe','Snapvere-Pro-Setup.exe','Snapvere-Pro-Setup.msi')
          foreach ($name in $windowsNames) {
            $file = Join-Path $dist $name
            if (!(Test-Path $file) -or (Get-Item $file).Length -lt 1000000) {
              throw "Missing or invalid Windows edition: $name"
            }
          }
          $linuxNames = @('Snapvere-Linux-amd64.deb','Snapvere-Linux-x86_64.AppImage',
                          'Snapvere-Pro-Linux-amd64.deb','Snapvere-Pro-Linux-x86_64.AppImage')
          $linuxHashes = @{}
          $linuxManifest = Join-Path $PWD 'dist-linux/SHA256SUMS-Linux.txt'
          if (-not (Test-Path $linuxManifest)) { throw 'Missing Linux QA checksum manifest' }
          foreach ($line in @(Get-Content $linuxManifest)) {
            if ($line -notmatch '^([0-9a-f]{64})  (Snapvere(?:-Pro)?-Linux-(?:amd64\.deb|x86_64\.AppImage))$') {
              throw "Unexpected Linux checksum entry: $line"
            }
            if ($linuxHashes.ContainsKey($Matches[2])) { throw "Duplicate Linux package: $($Matches[2])" }
            $linuxHashes[$Matches[2]] = $Matches[1]
          }
          if ($linuxHashes.Count -ne $linuxNames.Count) { throw 'Incomplete Linux manifest' }
          foreach ($name in $linuxNames) {
            $file = Join-Path $PWD "dist-linux/$name"
            if (-not (Test-Path $file)) { throw "Missing Linux package: $name" }
            if ((Get-Item $file).Length -lt 1000000) { throw "Undersized Linux package: $name" }
            $actualHash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $linuxHashes[$name]) { throw "Linux checksum mismatch: $name" }
            Copy-Item $file (Join-Path $dist $name)
          }
          python tools/generate_sbom.py --output "dist-installers/Snapvere-SBOM.cdx.json"
          if ($LASTEXITCODE -ne 0) { throw "Could not generate supply-chain SBOM" }
          # Reproducible, per-browser extension source ZIPs are shipped in the
          # SAME release and covered by the SAME release checksums.
          python tools/build_browser_extensions.py --build --zip-dir dist-installers
          if ($LASTEXITCODE -ne 0) { throw "Could not create seven browser ZIP packages" }
          python tools/check_extension_zip_contents.py --dir dist-installers
          if ($LASTEXITCODE -ne 0) { throw "Release ZIP audit failed" }
          python tools/generate_update_manifest.py --version "${{ steps.version.outputs.value }}" --out "dist-installers/Snapvere-update-stable.json"
          if ($LASTEXITCODE -ne 0) { throw "Could not generate the version-only update manifest" }
          $browserArchives = @('chrome','firefox','edge','brave','opera','vivaldi','safari') |
            ForEach-Object { "Snapvere-$_-extension-0.2.2.zip" }
          foreach ($name in $browserArchives) {
            $file = Join-Path $dist $name
            if (-not (Test-Path $file)) { throw "Browser extension package missing: $name" }
            if ((Get-Item $file).Length -lt 2000) { throw "Unexpectedly small browser extension: $name" }
          }
          $feed = Get-Content (Join-Path $dist 'Snapvere-update-stable.json') -Raw | ConvertFrom-Json
          if ($feed.product -ne 'snapvere-tauri-windows' -or
              $feed.version -ne "${{ steps.version.outputs.value }}" -or
              $feed.download_url -ne 'https://snapvere.com/download/tauri/') {
            throw 'Invalid release version manifest; refusing publication'
          }
          $expected = $windowsNames + $linuxNames
          foreach ($name in $expected) {
            $f = Join-Path $dist $name
            if (-not (Test-Path $f)) { throw "Required Windows artifact missing: $name" }
            if ((Get-Item $f).Length -lt 1000000) { throw "Unexpectedly small artifact: $name" }
          }
          # Also authenticate the published SBOM against the release manifest.
          $checksumTargets = @($expected) + @('Snapvere-SBOM.cdx.json', 'Snapvere-update-stable.json') + $browserArchives
          $hashes = foreach ($name in $checksumTargets) {
            $file = Join-Path $dist $name
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $hashes | Set-Content (Join-Path $dist "SHA256SUMS.txt") -Encoding ascii
          Get-ChildItem $dist | Format-Table Name,Length
      - name: Upload verified installers as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snapvere-v${{ steps.version.outputs.value }}-Windows-and-Linux
          path: dist-installers/*
          if-no-files-found: error
          retention-days: 90
      - name: Ensure legacy unsigned release metadata remains prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = '${{ github.repository }}'
          foreach ($tag in @('v0.2.25','v0.2.26','v0.2.27')) {
            $existing = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or !$existing.id) { throw "Cannot inspect previous release $tag" }
            if (-not $existing.draft -and -not $existing.prerelease) {
              gh release edit $tag --repo $repo --prerelease
              if ($LASTEXITCODE -ne 0) { throw "Cannot restore prerelease status for $tag" }
            }
            $verified = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or -not $verified.prerelease) { throw "Unsigned release $tag is still marked stable" }
          }
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: Snapvere v${{ steps.version.outputs.value }} — Brendigo
          draft: true
          prerelease: true
          fail_on_unmatched_files: true
          files: dist-installers/*
          body: |
            # Snapvere v${{ steps.version.outputs.value }} — Windows + Linux previews
            Branded by **Brendigo** · https://brendigo.com · https://snapvere.com

            ### Download
            - **Snapvere-Portable.exe** — run directly; no installer or administrator access required (Windows WebView2 runtime is required)
            - **Snapvere-Setup.exe** — NSIS installer
            - **Snapvere-Setup.msi** — MSI installer
            - **Snapvere-Linux-amd64.deb** — Linux amd64 preview; install on compatible Debian/Ubuntu distributions
            - **Snapvere-Linux-x86_64.AppImage** — Linux x86_64 preview AppImage (requires compatible system libraries)
            - **Snapvere-Pro-Portable.exe / Snapvere-Pro-Setup.exe / Snapvere-Pro-Setup.msi** — separate Pro Windows x64 build and installers
            - **Snapvere-Pro-Linux-amd64.deb / Snapvere-Pro-Linux-x86_64.AppImage** — separate Pro Linux x64 preview packages
            - **Snapvere Pro features** — professional recording presets, three local saved profiles and native-only batch export to a folder selected by the user
            - **Pro preview** — not a paid, entitlement-enforced release. No activation or account backend is implemented.
            - **SHA256SUMS.txt** — integrity checksums for all packages and the dependency inventory
            - **Snapvere-SBOM.cdx.json** — reproducible CycloneDX 1.6 dependency inventory from npm and Cargo lockfiles
            - **Seven browser extension ZIP packages v0.2.2** — Chrome, Firefox, Edge, Brave, Opera, Vivaldi and Safari independently bundled source packages (Safari requires Apple packaging/signing)
            - **Snapvere-update-stable.json** — server-ready version notification manifest; upload it as `stable.json` to your configured `update.snapvere.com` only after the matching Tauri release is available on the official download page

            All Windows and Linux installers, the seven browser extensions, the SBOM and the update manifest are covered by SHA256SUMS.txt.
            The browser ZIPs are developer/source packages, not approved or signed browser-store distributions.

            All six Windows packages and four Linux packages are compiled from the **same Git revision** using distinct Free/Pro bundle identifiers; the seven extension ZIPs are generated from audited source at that commit.

            ### Changes in v${{ steps.version.outputs.value }}
            - Separate Tauri/Rust update notices from incompatible WinUI/.NET website installers.
            - Fix the collapsed browser extension popup shown in compact browser
              toolbar windows: stable document sizing, readable one-line actions,
              proper icon/label alignment and responsive dark/light layout.
            - Ship seven independently bundled browser extensions v0.2.2 and
              verify small screens with Chromium screenshots/geometry tests.
            - Display release availability at the bottom-right of the Windows
              application, with a close action remembered for that version only.
              A newer release can notify again; startup checks remain optional.
            - Keep official HTTPS-only, time-bounded, version-only update checks
              and a user-initiated download link; no silent installer execution.
            - Mark the previous unsigned v0.2.25 metadata as prerelease and enforce the same status for the new packages.
            - Preserve private offline capture, PrintScreen, local gallery,
              clipboard transfer and existing least-privilege permissions.
            - Enforce TypeScript, Rust tests/Clippy, RustSec and SHA-256 release
              verification, with manual real-device acceptance still required.

            **Update security:** The built-in update check is informational only.
            No installer is downloaded or executed automatically. New downloads
            are opened on the official website and should be verified against
            publisher signatures and published SHA-256 hashes.

            **Preview release.** Linux uses the same React/Tauri design, screenshot/editor/gallery and silent GIF backend; Linux MP4, microphone, system audio and recorded mouse cursor are not implemented. Linux X11/Wayland compatibility needs physical QA.

            Native Windows 10/11 capture, recorder, audio, multi-monitor,
            accessibility, install/upgrade/uninstall and 1:1 visual comparisons are not yet
            confirmed on representative physical Windows devices. CI does not substitute for QA.

            The public snapvere.com service currently distributes a separate .NET/WinUI edition.
            These packages are the Tauri/Rust repository edition, not interchangeable updates.
            This release is unsigned; use SHA256SUMS.txt to check each file.

      - name: Verify draft release integrity before making preview publicly available
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v${{ steps.version.outputs.value }}'
          $repo = '${{ github.repository }}'
          $release = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Cannot read release $tag" }
          if (-not $release.prerelease) {
            gh release edit $tag --repo $repo --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Cannot correct prerelease flag $tag" }
            $release = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Cannot verify prerelease flag $tag" }
          }
          if (-not $release.draft -or -not $release.prerelease) {
            throw "Release $tag must remain a private draft until asset verification completes"
          }
          # Publishing an installer-only release is a failure: every browser
          # extension, the update notice, the SBOM and the hashes must ship.
          $browserZips = @('chrome','firefox','edge','brave','opera','vivaldi','safari') |
            ForEach-Object { "Snapvere-$($_)-extension-0.2.2.zip" }
          $requiredAssets = @(
            'Snapvere-Portable.exe',
            'Snapvere-Setup.exe',
            'Snapvere-Setup.msi',
            'Snapvere-Pro-Portable.exe',
            'Snapvere-Pro-Setup.exe',
            'Snapvere-Pro-Setup.msi',
            'Snapvere-Linux-amd64.deb',
            'Snapvere-Linux-x86_64.AppImage',
            'Snapvere-Pro-Linux-amd64.deb',
            'Snapvere-Pro-Linux-x86_64.AppImage',
            'Snapvere-SBOM.cdx.json',
            'Snapvere-update-stable.json',
            'SHA256SUMS.txt'
          ) + $browserZips
          $actualAssets = @($release.assets | ForEach-Object { $_.name })
          $missing = @($requiredAssets | Where-Object { $actualAssets -notcontains $_ })
          if ($missing.Count -ne 0) {
            throw "Incomplete $tag GitHub release; missing: $($missing -join ', ')"
          }
          if ($actualAssets.Count -ne $requiredAssets.Count) {
            throw "Unexpected release asset count $($actualAssets.Count); expected $($requiredAssets.Count)"
          }
          $checksumFiles = @(Get-Content 'dist-installers/SHA256SUMS.txt' | ForEach-Object {
            $parts = $_ -split '  ', 2
            if ($parts.Count -ne 2 -or $parts[0].Length -ne 64 -or
                $parts[0] -match '[^0-9a-f]') {
              throw "Malformed release checksum entry: $_"
            }
            $parts[1]
          })
          $unhashed = @($requiredAssets | Where-Object {
            $_ -ne 'SHA256SUMS.txt' -and $checksumFiles -notcontains $_
          })
          if ($unhashed.Count -ne 0 -or $checksumFiles.Count -ne ($requiredAssets.Count - 1)) {
            throw "Published release assets are not fully covered by SHA256SUMS.txt"
          }
          Write-Host "Verified $($requiredAssets.Count) draft assets and SHA-256 coverage"
          gh release edit $tag --repo $repo --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Unable to publish verified prerelease $tag" }
          $published = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $published.draft -or -not $published.prerelease) {
            throw "Published release must remain a prerelease, not stable"
          }
          Write-Host "Published verified Free and Pro prerelease packages: $tag"
