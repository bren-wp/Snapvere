name: SNAPVERE dependency freshness and security report

# The former v0.2.9-only updater silently ignored all current branches and
# granted contents:write to jobs running on freshly downloaded dependencies.
# Dependabot handles update PR creation; this report never writes to GitHub.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * 1'

permissions:
  contents: read

concurrency:
  group: snapvere-dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm:
    name: Check npm dependency freshness and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install locked npm graph without lifecycle scripts
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Assert locked graph security
        working-directory: apps/desktop
        run: npm audit --audit-level=high
      - name: Export npm outdated report without changing package files
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../dependency-reports
          npm outdated --json > ../../dependency-reports/npm-outdated.json || status=$?
          if [ "${status:-0}" -ne 0 ] && [ "${status:-0}" -ne 1 ]; then
            echo "npm outdated failed unexpectedly (exit ${status})"
            exit "${status}"
          fi
          cat ../../dependency-reports/npm-outdated.json
      - name: Upload npm freshness report
        uses: actions/upload-artifact@v4
        with:
          name: snapvere-npm-freshness
          path: dependency-reports/npm-outdated.json
          if-no-files-found: error
          retention-days: 30

  rust:
    name: Verify Cargo security and report outdated crates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned RustSec scanner and cargo-outdated
        run: |
          cargo install cargo-audit --version 0.23.0 --locked
          cargo install cargo-outdated --locked
      - name: Assert bundled SQLite is patched
        run: python tools/check_sqlite_security.py
      - name: Audit locked crates
        run: cargo audit --file apps/desktop/src-tauri/Cargo.lock
      - name: Report compatible and breaking Cargo updates without writing lockfile
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../../dependency-reports
          cargo outdated --format json > ../../../dependency-reports/cargo-outdated.json
      - name: Upload Cargo freshness report
        uses: actions/upload-artifact@v4
        with:
          name: snapvere-cargo-freshness
          path: dependency-reports/cargo-outdated.json
          if-no-files-found: error
          retention-days: 30
