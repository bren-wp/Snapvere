name: SNAPVERE v0.2.18 verified Cargo.lock compatible update

# One-shot, branch-scoped updater: no automated merge, no Cargo.toml rewrite.
# Cargo.lock is only pushed after successful Windows compilation, strict
# Clippy, Rust tests, SQLite and cargo-audit advisory checks.
on:
  push:
    branches: ["fix/v0.2.18-mf-com-lifecycle-and-release-qa"]
    paths: [".github/workflows/cargo-patch-v0218.yml"]

permissions:
  contents: read

jobs:
  checked-cargo-update:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Update compatible crates within existing tested semver constraints
        working-directory: apps/desktop/src-tauri
        run: cargo update
      - name: Check unchanged source formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check
      - name: Run updated Rust tests on Windows
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      - name: Strict Clippy with all test targets
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Reject vulnerable bundled SQLite and known RustSec advisories
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/check_sqlite_security.py
          if ($LASTEXITCODE -ne 0) { throw 'SQLite security gate failed' }
          cargo install cargo-audit --version 0.23.0 --locked
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install pinned RustSec scanner' }
          cargo audit --file apps/desktop/src-tauri/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'RustSec audit failed' }
      - name: Reject modifications outside the Cargo.lock file
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $other = git diff --name-only -- . ':!apps/desktop/src-tauri/Cargo.lock'
          if (($other | Out-String).Trim()) { throw "Unexpected updates: $other" }
      - name: Commit only audited Cargo.lock to PR branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src-tauri/Cargo.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'Already current: no Cargo.lock change'; exit 0 }
          git commit -m 'chore(deps): update compatible audited Rust lockfile'
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
          gh auth setup-git
          git fetch origin $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Fetch failed' }
          git rebase "origin/$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Rebase failed' }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Push failed' }
