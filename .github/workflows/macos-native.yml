# Snapvere by Brendigo
name: macOS shared-core feasibility (experimental)
on:
  pull_request:
    branches:
      - main
    paths:
      - 'macOS/**'
      - 'apps/desktop/**'
      - '.github/workflows/macos-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: snapvere-macos-feasibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-check:
    name: macOS ${{ matrix.arch }} Free and Pro compile probe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            host: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x64
            host: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Confirm native architecture and check shared locked source
        shell: bash
        env:
          EXPECTED_RUST_HOST: ${{ matrix.host }}
        run: |
          set -euo pipefail
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_RUST_HOST"
          bash macOS/check-native.sh
