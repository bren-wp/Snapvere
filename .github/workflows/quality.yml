name: Snapvere build and quality checks
on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: snapvere-quality-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend and brand verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install locked dependencies without lifecycle hooks
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require SHA-512 pinned patched picomatch registry tarball
        working-directory: apps/desktop
        shell: bash
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const dep = lock.packages['node_modules/picomatch'];
          assert.equal(dep.name, '@ryotsu/picomatch');
          assert.equal(dep.version, '4.0.7-a');
          assert.equal(dep.resolved, 'https://registry.npmjs.org/@ryotsu/picomatch/-/picomatch-4.0.7-a.tgz');
          assert.equal(dep.integrity, 'sha512-JroBFEmaejC7szGSfqOhF1QZHLKvX2wTA1+fWyfkpy3BjzdQKNPLKa2FtgeKVUDy5/UPUNkXEeCHJ5ZRBMLTVA==');
          console.log('Verified patched picomatch tarball is pinned by SHA-512');
          NODE
      - name: Verify Snapvere by Brendigo source headers
        run: python tools/check_source_headers.py
      - name: Enforce reachable Rust modules (dead-code graph)
        run: python tools/check_rust_modules.py
      - name: Enforce reachable TypeScript modules (dead-code graph)
        working-directory: apps/desktop
        run: node ../../tools/check_dead_code.mjs
      - name: Verify locked Prettier CLI
        working-directory: apps/desktop
        run: npm exec --no -- prettier --version
      - name: Strict TypeScript static analysis
        working-directory: apps/desktop
        run: npm run lint
      - name: Test screenshot preferences and gallery pagination
        working-directory: apps/desktop
        run: npm run test:unit
      - name: Typecheck and build
        working-directory: apps/desktop
        run: npm run build
      - name: Verify offline app and block unreviewed backdoor/network/process patterns
        run: python tools/check_no_backdoor_patterns.py
      - name: Verify Tailwind 4 migration and CSS-first design tokens
        run: python tools/check_tailwind4.py
      - name: Fail on unsafe dynamic HTML/code execution in public JavaScript
        run: python tools/check_frontend_security.py
      - name: Verify first-party downloads, HTML links and checksums
        run: python tools/check_website.py
      - name: Verify installer EULA and block public GitHub links
        run: python tools/check_public_distribution.py
      - name: Verify all frontend IPC commands are registered by Rust
        run: python tools/check_ipc_contract.py
      - name: Enforce per-window Tauri capability isolation
        run: python tools/check_tauri_capabilities.py
      - name: Reject unsafe dependency updater permissions and version drift
        run: python tools/check_dependency_policy.py
      - name: Smoke-test release ZIPs and official update manifest at the exact PR commit
        shell: bash
        run: |
          set -euo pipefail
          python tools/test_browser_extension_line_endings.py
          python tools/build_browser_extensions.py --check
          python tools/build_browser_extensions.py --build --zip-dir extension-package-validation
          python tools/check_extension_zip_contents.py --dir extension-package-validation
          version=$(node -p "require('./apps/desktop/package.json').version")
          python tools/generate_update_manifest.py --version "$version" --out extension-package-validation/Snapvere-update-stable.json
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.build_browser_extensions import VERSION as extension_version
          path = Path("extension-package-validation/Snapvere-update-stable.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["product"] == "snapvere-tauri-windows"
          assert data["download_url"] == "https://snapvere.com/download/"
          assert len(list(path.parent.glob(f"Snapvere-*-extension-{extension_version}.zip"))) == 7
          print("All seven browser ZIPs and version-only update feed passed release rehearsal")
          PY
      - name: Reject duplicate release version before merging application changes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if ! git diff --name-only "$BASE_SHA" HEAD -- apps/ .github/workflows/release.yml | grep -q .; then
            echo "No packaged application or release workflow changes: release version bump not required."
            exit 0
          fi
          version=$(node -p "require('./apps/desktop/package.json').version")
          matching=$(git ls-remote --tags origin "refs/tags/v$version")
          if [ -n "$matching" ]; then
            echo "::error::Release tag v$version already exists; bump Cargo, Tauri and npm versions/lockfiles before merging."
            exit 1
          fi
          echo "Release tag v$version is available for this application change."
      - name: Verify matching public and desktop design tokens
        run: python tools/check_brand_tokens.py
      - name: Audit browser extension dead-file graph and desktop design token parity
        run: |
          python tools/audit_browser_extension_graph.py
          python tools/check_extension_design_tokens.py
      - name: Check capture overlay pipeline and legacy brand references
        run: python tools/check_capture_pipeline.py
      - name: Parse site and app config
        run: |
          node --check site/app.js
          node --check site/download.js
          node --check site/config.js
          python -m json.tool apps/desktop/src-tauri/tauri.conf.json > /dev/null
      - name: Regression-test public download OS parameters
        run: node --test tools/tests/downloadOS.test.mjs
      - name: Verify public surfaces are Snapvere branded
        shell: bash
        run: |
          legacy_pattern="$(printf '%s' 'rv' 'geshot')|$(printf '%s' 'not' 'brec')"
          if git grep -niE "$legacy_pattern" -- .; then
            echo 'Legacy identity found in tracked source or documentation.'
            exit 1
          fi
          if git ls-files | grep -iE "$legacy_pattern"; then
            echo 'Legacy identity found in tracked paths.'
            exit 1
          fi
          grep -qi 'Brendigo' README.md
          grep -q 'snapvere.com' README.md
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('apps/desktop/src-tauri/tauri.conf.json').read_text())
          npm = json.loads(Path('apps/desktop/package.json').read_text())
          assert config['productName'] == 'Snapvere'
          assert config['identifier'] == 'com.brendigo.snapvere'
          assert config['version'] == npm['version']
          assert npm['author'].startswith('Brendigo')
          assert npm['homepage'] == 'https://snapvere.com'
          PY
      - name: NPM security audit (production and development)
        working-directory: apps/desktop
        run: npm audit --audit-level=high
      - name: Produce auditable npm and Cargo SBOM for this build
        run: python tools/generate_sbom.py --output dependency-reports/snapvere-sbom.cdx.json
      - name: Archive version-locked supply-chain inventory
        uses: actions/upload-artifact@v4
        with:
          name: Snapvere-SBOM-${{ github.sha }}
          path: dependency-reports/snapvere-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

  rustsec:
    name: RustSec advisory audit of locked Rust dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned RustSec cargo-audit scanner
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Assert SQLite bundled crate contains known CVE-2026-119375 fix
        run: python tools/check_sqlite_security.py
      - name: Fail on RustSec dependency security advisories
        run: cargo audit --file apps/desktop/src-tauri/Cargo.lock

  native:
    name: Rust tests and all Windows packages
    runs-on: windows-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install locked dependencies without lifecycle hooks
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build frontend for Tauri
        working-directory: apps/desktop
        run: npm run build
      - name: Validate native Windows QA capture PowerShell syntax (no desktop capture in CI)
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/windows-native-capture.ps1').Path,
            [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) {
            throw "Windows native capture script syntax errors: $($parseErrors | Out-String)"
          }
      - name: Windows regression gate for browser source line endings
        shell: pwsh
        run: |
          python tools/test_browser_extension_line_endings.py
          if ($LASTEXITCODE -ne 0) { throw "Browser CRLF/LF regression failed" }
          python tools/build_browser_extensions.py --check
          if ($LASTEXITCODE -ne 0) { throw "Windows checkout changed extension content" }
          python tools/audit_browser_extension_graph.py
          if ($LASTEXITCODE -ne 0) { throw "Windows extension source audit failed" }
      - name: Verify Rust format without changing source
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check
      - name: Run Rust tests with locked dependencies
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      - name: Enforce Clippy correctness and dead-code checks
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build portable / NSIS / MSI
        working-directory: apps/desktop
        run: npm run tauri -- build --bundles nsis,msi
      - name: Verify packages and generate SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $PWD 'apps/desktop/src-tauri/target/release'
          $out = Join-Path $PWD 'dist-installers'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exe = Join-Path $target 'snapvere.exe'
          $nsis = Get-ChildItem (Join-Path $target 'bundle/nsis') -Filter '*.exe' -File | Select-Object -First 1
          $msi = Get-ChildItem (Join-Path $target 'bundle/msi') -Filter '*.msi' -File | Select-Object -First 1
          if (!(Test-Path $exe) -or !$nsis -or !$msi) { throw 'Missing a required Windows package' }
          Copy-Item $exe (Join-Path $out 'Snapvere-Portable.exe')
          Copy-Item $nsis.FullName (Join-Path $out 'Snapvere-Setup.exe')
          Copy-Item $msi.FullName (Join-Path $out 'Snapvere-Setup.msi')
          @('Snapvere-Portable.exe','Snapvere-Setup.exe','Snapvere-Setup.msi') | ForEach-Object {
            $path = Join-Path $out $_
            if ((Get-Item $path).Length -lt 1000000) { throw "Invalid package: $_" }
          }
          Get-ChildItem $out -File | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)"
          } | Set-Content (Join-Path $out 'SHA256SUMS.txt') -Encoding ascii
      - name: Upload private QA build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Snapvere-Windows-QA-${{ github.sha }}
          path: dist-installers/*
          if-no-files-found: error
          retention-days: 30
