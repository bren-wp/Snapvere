name: Snapvere build and quality checks
on:
  # Feature branches are verified by pull_request; triggering on both
  # push and pull_request scheduled two full native builds for one commit,
  # exhausting Windows/Linux runners and repeatedly cancelling useful CI.
  # Keep mandatory post-merge main checks and manual branch dispatch.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: snapvere-quality-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend and brand verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install locked dependencies without lifecycle hooks
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require SHA-512 pinned patched picomatch registry tarball
        working-directory: apps/desktop
        shell: bash
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const dep = lock.packages['node_modules/picomatch'];
          assert.equal(dep.name, '@ryotsu/picomatch');
          assert.equal(dep.version, '4.0.7-a');
          assert.equal(dep.resolved, 'https://registry.npmjs.org/@ryotsu/picomatch/-/picomatch-4.0.7-a.tgz');
          assert.equal(dep.integrity, 'sha512-JroBFEmaejC7szGSfqOhF1QZHLKvX2wTA1+fWyfkpy3BjzdQKNPLKa2FtgeKVUDy5/UPUNkXEeCHJ5ZRBMLTVA==');
          console.log('Verified patched picomatch tarball is pinned by SHA-512');
          NODE
      - name: Verify Snapvere by Brendigo source headers
        run: python tools/check_source_headers.py
      - name: Enforce reachable Rust modules (dead-code graph)
        run: python tools/check_rust_modules.py
      - name: Audit duplicate maintained desktop and QA source files
        run: python tools/audit_duplicate_sources.py
      - name: Enforce production-only TypeScript module reachability
        working-directory: apps/desktop
        run: node ../../tools/check_dead_code.mjs
      - name: Verify all static UI translations and update messages in 12 locales
        run: node tools/check_translation_coverage.mjs
      - name: Verify locked Prettier CLI
        working-directory: apps/desktop
        run: npm exec --no -- prettier --version
      - name: Strict TypeScript static analysis
        working-directory: apps/desktop
        run: npm run lint
      - name: Test screenshot preferences and gallery pagination
        working-directory: apps/desktop
        run: npm run test:unit
      - name: Typecheck and build
        working-directory: apps/desktop
        run: npm run build
      - name: Verify offline app and block unreviewed backdoor/network/process patterns
        run: python tools/check_no_backdoor_patterns.py
      - name: Verify Tailwind 4 migration and CSS-first design tokens
        run: python tools/check_tailwind4.py
      - name: Fail on unsafe dynamic HTML/code execution in public JavaScript
        run: python tools/check_frontend_security.py
      - name: Verify least-privilege public website CSP and inline script hashes
        run: python tools/check_site_csp.py
      - name: Verify first-party downloads, HTML links and checksums
        run: python tools/check_website.py
      - name: Verify installer EULA and block public GitHub links
        run: python tools/check_public_distribution.py
      - name: Verify all frontend IPC commands are registered by Rust
        run: python tools/check_ipc_contract.py
      - name: Enforce separate Free/Pro identity, package and native security contracts
        run: python tools/check_edition_distribution.py
      - name: Enforce per-window Tauri capability isolation
        run: python tools/check_tauri_capabilities.py
      - name: Reject unsafe dependency updater permissions and version drift
        run: python tools/check_dependency_policy.py
      - name: Smoke-test release ZIPs and official update manifest at the exact PR commit
        shell: bash
        run: |
          set -euo pipefail
          python tools/test_browser_extension_line_endings.py
          python tools/build_browser_extensions.py --check
          python tools/build_browser_extensions.py --build --zip-dir extension-package-validation
          python tools/check_extension_zip_contents.py --dir extension-package-validation
          version=$(node -p "require('./apps/desktop/package.json').version")
          python tools/generate_update_manifest.py --version "$version" --out extension-package-validation/Snapvere-update-stable.json
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.build_browser_extensions import VERSION as extension_version
          path = Path("extension-package-validation/Snapvere-update-stable.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["product"] == "snapvere-tauri-windows"
          assert data["download_url"] == "https://snapvere.com/download/tauri/"
          assert len(list(path.parent.glob(f"Snapvere-*-extension-{extension_version}.zip"))) == 7
          print("All seven browser ZIPs and version-only update feed passed release rehearsal")
          PY
      - name: Reject duplicate release version before merging application changes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if ! git diff --name-only "$BASE_SHA" HEAD -- apps/ .github/workflows/release.yml | grep -q .; then
            echo "No packaged application or release workflow changes: release version bump not required."
            exit 0
          fi
          version=$(node -p "require('./apps/desktop/package.json').version")
          matching=$(git ls-remote --tags origin "refs/tags/v$version")
          if [ -n "$matching" ]; then
            echo "::error::Release tag v$version already exists; bump Cargo, Tauri and npm versions/lockfiles before merging."
            exit 1
          fi
          echo "Release tag v$version is available for this application change."
      - name: Verify matching public and desktop design tokens
        run: python tools/check_brand_tokens.py
      - name: Audit browser extension source reachability, privacy and design
        run: |
          python tools/audit_browser_extension_graph.py
          python tools/check_extension_privacy.py
          python tools/check_extension_design_tokens.py
      - name: Check capture overlay pipeline and legacy brand references
        run: python tools/check_capture_pipeline.py
      - name: Parse site and app config
        run: |
          node --check site/app.js
          node --check site/download.js
          node --check site/config.js
          python -m json.tool apps/desktop/src-tauri/tauri.conf.json > /dev/null
      - name: Regression-test downloads, analytics consent and edition isolation
        run: node --test tools/tests/*.test.mjs
      - name: Verify public surfaces are Snapvere branded
        shell: bash
        run: |
          legacy_pattern="$(printf '%s' 'rv' 'geshot')|$(printf '%s' 'not' 'brec')"
          if git grep -niE "$legacy_pattern" -- .; then
            echo 'Legacy identity found in tracked source or documentation.'
            exit 1
          fi
          if git ls-files | grep -iE "$legacy_pattern"; then
            echo 'Legacy identity found in tracked paths.'
            exit 1
          fi
          grep -qi 'Brendigo' README.md
          grep -q 'snapvere.com' README.md
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('apps/desktop/src-tauri/tauri.conf.json').read_text())
          npm = json.loads(Path('apps/desktop/package.json').read_text())
          assert config['productName'] == 'Snapvere'
          assert config['identifier'] == 'com.brendigo.snapvere'
          assert config['version'] == npm['version']
          assert npm['author'].startswith('Brendigo')
          assert npm['homepage'] == 'https://snapvere.com'
          PY
      - name: NPM security audit (production and development)
        working-directory: apps/desktop
        run: npm audit --audit-level=high
      - name: Produce auditable npm and Cargo SBOM for this build
        run: python tools/generate_sbom.py --output dependency-reports/snapvere-sbom.cdx.json
      - name: Archive version-locked supply-chain inventory
        uses: actions/upload-artifact@v4
        with:
          name: Snapvere-SBOM-${{ github.sha }}
          path: dependency-reports/snapvere-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

  rustsec:
    name: RustSec advisory audit of locked Rust dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned RustSec cargo-audit scanner
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Assert SQLite bundled crate contains known CVE-2026-119375 fix
        run: python tools/check_sqlite_security.py
      - name: Fail on RustSec dependency security advisories
        run: cargo audit --file apps/desktop/src-tauri/Cargo.lock

  native:
    name: Rust tests and all Windows packages
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install locked dependencies without lifecycle hooks
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build frontend for Tauri
        working-directory: apps/desktop
        run: npm run build
      - name: Validate native Windows QA capture PowerShell syntax (no desktop capture in CI)
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/windows-native-capture.ps1').Path,
            [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) {
            throw "Windows native capture script syntax errors: $($parseErrors | Out-String)"
          }
      - name: Windows regression gate for browser source line endings
        shell: pwsh
        run: |
          python tools/test_browser_extension_line_endings.py
          if ($LASTEXITCODE -ne 0) { throw "Browser CRLF/LF regression failed" }
          python tools/build_browser_extensions.py --check
          if ($LASTEXITCODE -ne 0) { throw "Windows checkout changed extension content" }
          python tools/audit_browser_extension_graph.py
          if ($LASTEXITCODE -ne 0) { throw "Windows extension source audit failed" }
      - name: Verify Rust format without changing source
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check
      - name: Run Rust tests with locked dependencies
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      - name: Enforce Clippy correctness and dead-code checks
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build Free Windows Portable / NSIS / MSI
        working-directory: apps/desktop
        run: npm run tauri -- build --bundles nsis,msi
      - name: Stage verified Free Windows packages before second build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path $PWD 'apps/desktop/src-tauri/target/release'
          $out = Join-Path $PWD 'dist-installers'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exe = Join-Path $base 'snapvere.exe'
          $nsis = @(Get-ChildItem (Join-Path $base 'bundle/nsis') -Filter '*.exe' -File)
          $msi = @(Get-ChildItem (Join-Path $base 'bundle/msi') -Filter '*.msi' -File)
          if (!(Test-Path $exe) -or $nsis.Count -ne 1 -or $msi.Count -ne 1) {
            throw 'Missing or ambiguous Free Windows artifact'
          }
          Copy-Item $exe (Join-Path $out 'Snapvere-Portable.exe')
          Copy-Item $nsis[0].FullName (Join-Path $out 'Snapvere-Setup.exe')
          Copy-Item $msi[0].FullName (Join-Path $out 'Snapvere-Setup.msi')
          Remove-Item (Join-Path $base 'bundle/nsis') -Recurse -Force
          Remove-Item (Join-Path $base 'bundle/msi') -Recurse -Force
      - name: Test native Pro Rust commands and filesystem security
        working-directory: apps/desktop/src-tauri
        run: |
          cargo test --features pro --locked
          cargo clippy --all-targets --features pro --locked -- -D warnings
      - name: Build Pro Windows Portable / NSIS / MSI from same audited source
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $env:VITE_SNAPVERE_EDITION = 'pro'
          npm run tauri -- build --bundles nsis,msi --features pro --config src-tauri/tauri.pro.conf.json
          if ($LASTEXITCODE -ne 0) { throw 'Pro native Windows build failed' }
      - name: Stage and check both Windows editions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path $PWD 'apps/desktop/src-tauri/target/release'
          $out = Join-Path $PWD 'dist-installers'
          $exe = Join-Path $base 'snapvere.exe'
          $nsis = @(Get-ChildItem (Join-Path $base 'bundle/nsis') -Filter '*.exe' -File)
          $msi = @(Get-ChildItem (Join-Path $base 'bundle/msi') -Filter '*.msi' -File)
          if (!(Test-Path $exe) -or $nsis.Count -ne 1 -or $msi.Count -ne 1) {
            throw 'Missing or ambiguous Pro Windows artifact'
          }
          if ($nsis[0].Name -notmatch 'Pro' -or $msi[0].Name -notmatch 'Pro') {
            throw 'Pro installers must embed the Pro product identity'
          }
          Copy-Item $exe (Join-Path $out 'Snapvere-Pro-Portable.exe')
          Copy-Item $nsis[0].FullName (Join-Path $out 'Snapvere-Pro-Setup.exe')
          Copy-Item $msi[0].FullName (Join-Path $out 'Snapvere-Pro-Setup.msi')
          $all = @('Snapvere-Portable.exe','Snapvere-Setup.exe','Snapvere-Setup.msi',
                   'Snapvere-Pro-Portable.exe','Snapvere-Pro-Setup.exe','Snapvere-Pro-Setup.msi')
          foreach ($name in $all) {
            $file = Join-Path $out $name
            if (!(Test-Path $file) -or (Get-Item $file).Length -lt 1000000) {
              throw "Missing or invalid edition package: $name"
            }
          }
          if ((Get-FileHash (Join-Path $out 'Snapvere-Portable.exe')).Hash -eq
              (Get-FileHash (Join-Path $out 'Snapvere-Pro-Portable.exe')).Hash) {
            throw 'Free/Pro executables are identical; edition configuration not applied'
          }
          Get-ChildItem $out -File | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)"
          } | Set-Content (Join-Path $out 'SHA256SUMS.txt') -Encoding ascii
      - name: Upload private QA build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Snapvere-Windows-QA-${{ github.sha }}
          path: dist-installers/*
          if-no-files-found: error
          retention-days: 30

  pipewire-audio:
    name: Native PipeWire audio transport (isolated virtual devices)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install PipeWire and GStreamer audio test prerequisites
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-pipewire gstreamer1.0-plugins-bad ffmpeg libpipewire-0.3-dev \
            pipewire pipewire-bin pipewire-pulse wireplumber pulseaudio-utils dbus-daemon
      - name: Compile native Wayland adapter and verify padded BGRA frames
        run: |
          cc -Wall -Wextra -Werror -O2 -DSNAPVERE_WAYLAND_TEST -Iapps/desktop/src-tauri/native \
            tools/native/wayland_frame_probe.c apps/desktop/src-tauri/native/linux_wayland.c \
            -o "$RUNNER_TEMP/wayland-frame-probe" \
            $(pkg-config --cflags --libs gio-unix-2.0 gstreamer-app-1.0 gstreamer-video-1.0)
          "$RUNNER_TEMP/wayland-frame-probe"
      - name: Verify real PCM from explicitly selected source and sink monitor
        run: bash tools/native/test_pipewire_audio.sh

  wayland-portal:
    name: Native Wayland portal window inclusion (isolated wlroots)
    # Noble's xdpw 0.7.1 requires DMA-BUF with screencopy v3 even on
    # Pixman headless outputs. Resolute's packaged 0.8.1 also stalled after
    # one frame. Use upstream 0.9.0: fixes buffer starvation, frame lifetime
    # across PAUSED/STREAMING, and first-frame scheduling on still outputs.
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate native shell test syntax before installing prerequisites
        run: |
          for script in tools/native/*.sh; do
            bash -n "$script"
          done
      - name: Install isolated compositor and portal prerequisites
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-pipewire gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            sway swaybg grim python3-gi python3-gi-cairo python3-pil gir1.2-gtk-3.0 \
            pipewire wireplumber dbus-daemon fuse3 xdg-desktop-portal xdg-desktop-portal-wlr \
            meson ninja-build libpipewire-0.3-dev libwayland-dev wayland-protocols \
            libinih-dev libgbm-dev libdrm-dev libsystemd-dev
          dpkg-query -W sway xdg-desktop-portal xdg-desktop-portal-wlr pipewire gstreamer1.0-pipewire
      - name: Build pinned upstream portal backend with frame lifecycle fixes
        shell: bash
        run: |
          set -euo pipefail
          revision=8388b8a6214470462146840e92909aff5983eeac
          source="$RUNNER_TEMP/snapvere-xdpw-source"
          git init "$source"
          git -C "$source" fetch --depth=1 https://github.com/emersion/xdg-desktop-portal-wlr.git "$revision"
          git -C "$source" checkout --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = "$revision"
          # CI-only patch; never modify the user's installed portal.
          git -C "$source" apply --check "$GITHUB_WORKSPACE/tools/native/xdpw-0.9.0-capture-timer.patch"
          git -C "$source" apply "$GITHUB_WORKSPACE/tools/native/xdpw-0.9.0-capture-timer.patch"
          meson setup "$RUNNER_TEMP/snapvere-xdpw-build" "$source" -Dsd-bus-provider=libsystemd -Dman-pages=disabled -Dsystemd=disabled
          meson compile -C "$RUNNER_TEMP/snapvere-xdpw-build"
          test -x "$RUNNER_TEMP/snapvere-xdpw-build/xdg-desktop-portal-wlr"
      - name: Verify actual authorized video before and after moving a native window
        run: |
          set -euo pipefail
          export SNAPVERE_QA_PORTAL_BACKEND="$RUNNER_TEMP/snapvere-xdpw-build/xdg-desktop-portal-wlr"
          # Independent sessions, not retries: every run must succeed.
          for trial in 1 2 3; do
            echo "Portal acceptance session $trial/3"
            bash tools/native/test_wayland_portal.sh
          done

  linux:
    name: Linux x86_64 native tests and preview packages
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Tauri / xcap Linux system build prerequisites
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev \
            libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev \
            libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev libfuse2t64 rpm \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev xvfb xauth x11-xserver-utils \
            sway dbus-daemon \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad ffmpeg
      - name: Verify required GBM development linker library
        run: |
          pkg-config --exists gbm
          pkg-config --modversion gbm
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install locked JS dependencies without postinstall scripts
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck shared Windows / Linux React frontend
        working-directory: apps/desktop
        run: npm run lint && npm run test:unit
      - name: Verify Rust formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check
      - name: Linux Rust unit and integration tests (no display required)
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      - name: Linux Clippy (warnings treated as errors)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Exercise real X11 framebuffer capture in Free and Pro
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          unset WAYLAND_DISPLAY
          export XDG_SESSION_TYPE=x11
          for features in free pro; do
            args=()
            if [[ "$features" == pro ]]; then args=(--features pro); fi
            xvfb-run -a -s '-screen 0 640x480x24 -nolisten tcp -noreset' bash -c '
              set -e
              xsetroot -solid "#123456"
              cargo test --locked "$@" native_x11_capture_checks_real_pixels_and_monitor_identity -- --ignored
            ' bash "${args[@]}"
          done
      - name: Encode and decode a real Linux H.264 MP4 (experimental backend)
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          export SNAPVERE_TEST_MP4_PATH="$RUNNER_TEMP/snapvere-native-test.mp4"
          cargo test --locked --features linux-native-media record::wayland_outputs::tests
          cargo test --locked --features linux-native-media record::wayland::tests
          cargo test --locked --features linux-native-media record::audio_clock::tests
          cargo test --locked --features linux-native-media record::linux_mp4::tests
          export SNAPVERE_ANNOTATED_MP4="$RUNNER_TEMP/annotated.mp4"
          export SNAPVERE_ANNOTATED_GIF="$RUNNER_TEMP/annotated.gif"
          cargo test --locked --features linux-native-media annotated_gif_and_mp4_encoder_fixtures
          python ../../../tools/native/verify_annotation_frames.py "$SNAPVERE_ANNOTATED_MP4" "$SNAPVERE_ANNOTATED_GIF"
          export SNAPVERE_TIMING_MP4="$RUNNER_TEMP/timing.mp4"
          export SNAPVERE_TIMING_GIF="$RUNNER_TEMP/timing.gif"
          export SNAPVERE_TIMING_MANIFEST="$RUNNER_TEMP/preview-timing.csv"
          cargo test --locked --features linux-native-media preview_timing_encoder_fixtures
          python ../../../tools/native/verify_preview_timing.py "$SNAPVERE_TIMING_MANIFEST" "$SNAPVERE_TIMING_MP4" "$SNAPVERE_TIMING_GIF"
          cargo clippy --all-targets --locked --features linux-native-media -- -D warnings
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$SNAPVERE_TEST_MP4_PATH")" = h264
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$SNAPVERE_TEST_MP4_PATH")" = "64,48"
          ffmpeg -v error -xerror -i "$SNAPVERE_TEST_MP4_PATH" -f null -
      - name: Native headless wlroots mixed-DPI geometry (Free and Pro)
        shell: bash
        run: bash tools/native/test_wayland_outputs.sh
      - name: Build Free Linux DEB, RPM and AppImage for QA
        working-directory: apps/desktop
        run: npm run tauri -- build --bundles deb,rpm,appimage
      - name: Stage Free Linux packages before building Pro
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          root=apps/desktop/src-tauri/target/release/bundle
          mkdir -p dist-linux
          deb=("$root"/deb/*.deb)
          rpm=("$root"/rpm/*.rpm)
          image=("$root"/appimage/*.AppImage)
          [[ ${#deb[@]} == 1 && ${#rpm[@]} == 1 && ${#image[@]} == 1 ]]
          cp -- "${deb[0]}" dist-linux/Snapvere-Linux-amd64.deb
          cp -- "${rpm[0]}" dist-linux/Snapvere-Linux-x86_64-UNTESTED.rpm
          cp -- "${image[0]}" dist-linux/Snapvere-Linux-x86_64.AppImage
          rm -rf -- "$root/deb" "$root/rpm" "$root/appimage"
      - name: Test native Pro Linux batch export and recording operations
        working-directory: apps/desktop/src-tauri
        run: |
          cargo test --features pro --locked
          cargo clippy --all-targets --features pro --locked -- -D warnings
      - name: Build Pro Linux DEB, RPM and AppImage from same source
        working-directory: apps/desktop
        env:
          VITE_SNAPVERE_EDITION: pro
        run: npm run tauri -- build --bundles deb,rpm,appimage --features pro --config src-tauri/tauri.pro.conf.json
      - name: Validate both Linux editions and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          root=apps/desktop/src-tauri/target/release/bundle
          deb=("$root"/deb/*.deb)
          rpm=("$root"/rpm/*.rpm)
          image=("$root"/appimage/*.AppImage)
          [[ ${#deb[@]} == 1 && ${#rpm[@]} == 1 && ${#image[@]} == 1 ]]
          [[ "${deb[0]}" == *Pro* && "${rpm[0]}" == *Pro* && "${image[0]}" == *Pro* ]] || {
            echo "::error::Pro Linux archives must contain the Pro product identity"
            exit 1
          }
          cp -- "${deb[0]}" dist-linux/Snapvere-Pro-Linux-amd64.deb
          cp -- "${rpm[0]}" dist-linux/Snapvere-Pro-Linux-x86_64-UNTESTED.rpm
          cp -- "${image[0]}" dist-linux/Snapvere-Pro-Linux-x86_64.AppImage
          for name in Snapvere-Linux-amd64.deb Snapvere-Linux-x86_64.AppImage \
                      Snapvere-Pro-Linux-amd64.deb Snapvere-Pro-Linux-x86_64.AppImage; do
            test "$(stat -c%s "dist-linux/$name")" -gt 1000000
          done
          for name in Snapvere-Linux-x86_64-UNTESTED.rpm Snapvere-Pro-Linux-x86_64-UNTESTED.rpm; do
            rpm -qp --queryformat '%{ARCH}\n' "dist-linux/$name" | grep -qx 'x86_64'
            if rpm -qp --requires "dist-linux/$name" | grep -E '(^|[^[:alnum:]])(libwebkit2gtk-4\.1-0|libayatana-appindicator3-1|libgtk-3-0)([[:space:]]|$)'; then
              echo "::error::RPM requires a Debian package: $name"
              exit 1
            fi
          done
          chmod 755 dist-linux/*.AppImage
          if cmp -s dist-linux/Snapvere-Linux-amd64.deb dist-linux/Snapvere-Pro-Linux-amd64.deb; then
            echo "::error::Free and Pro Linux DEBs are identical"
            exit 1
          fi
          (cd dist-linux && sha256sum ./* > SHA256SUMS-Linux.txt)
          (cd dist-linux && sha256sum --check SHA256SUMS-Linux.txt)
      - name: Upload untested Linux preview and RPM QA artifacts (not public release)
        uses: actions/upload-artifact@v4
        with:
          name: Snapvere-Linux-QA-${{ github.sha }}
          path: dist-linux/*
          if-no-files-found: error
          retention-days: 30
