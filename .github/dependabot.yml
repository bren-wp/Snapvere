version: 2

# Reviewed update PRs, never untested automatic merges. Security updates
# stay enabled and are not suppressed by the minor/patch grouping.
updates:
  - package-ecosystem: "npm"
    directory: "/apps/desktop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Zagreb"
    open-pull-requests-limit: 10
    groups:
      npm-compatible:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Build-only patched fork needs explicit provenance/advisory review.
      - dependency-name: "picomatch"

  - package-ecosystem: "cargo"
    directory: "/apps/desktop/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "Europe/Zagreb"
    open-pull-requests-limit: 10
    groups:
      rust-compatible:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Zagreb"
    open-pull-requests-limit: 5
    groups:
      actions-compatible:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
